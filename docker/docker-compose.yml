version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fugen_postgres
    environment:
      POSTGRES_USER: fugen_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: fugen_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fugen_redis
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:v1.5.0
    container_name: fugen_livekit
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml

volumes:
  postgres_data:
